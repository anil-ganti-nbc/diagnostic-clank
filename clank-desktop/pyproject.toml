[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clank-desktop"
version = "0.0.1.dev0"
description = "Native PySide6 desktop shell for Unified Clank Infrastructure (Stage 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Unified Clank Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.scripts]
clank-desktop = "clank_desktop.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clank_desktop"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
