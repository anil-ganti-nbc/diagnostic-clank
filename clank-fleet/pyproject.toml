[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clank-fleet"
version = "0.0.1.dev0"
description = "Fleet control plane, API shell, and CLI for Unified Clank Infrastructure (Stage 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Unified Clank Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12,<1",
    "pyyaml>=6.0,<7",
    "clank-runtime",  # install editable from sibling first
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.scripts]
clank = "clank_fleet.cli:app"

[project.urls]
Documentation = "https://github.com/example/unified-clank/tree/main/clank-fleet"
Repository = "https://github.com/example/unified-clank"

[tool.hatch.build.targets.wheel]
packages = ["src/clank_fleet"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/compose",
    "/config",
    "/docs",
    "/inventories",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
