[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clank-runtime"
version = "0.0.1.dev0"
description = "Shared runtime contracts and interfaces for Unified Clank Infrastructure (Stage 0 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Unified Clank Team" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.7,<3",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[project.urls]
Documentation = "https://github.com/example/unified-clank/tree/main/clank-runtime"
Repository = "https://github.com/example/unified-clank"

[tool.hatch.build.targets.wheel]
packages = ["src/clank_runtime"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
