claims:
  - id: DB-011-c1
    text: "The Minisforum 895D7 Radar hit was probably stale because the related 139D7 sibling and family/chassis concept already existed."
    authority_domain: agent_assertion
    expected_fate: superseded
  - id: DB-011-c2
    text: "The exact 895D7 SKU was a legitimate new Minisforum launch."
    authority_domain: owner_observation
    expected_fate: retained
  - id: DB-011-c3
    text: "VideoCardz independently reported the 895D7 launch."
    authority_domain: agent_report
    expected_fate: retained
fix: "Before NOT_NEW, STALE, NOISE, or equivalent negative editorial classification, verify dated evidence for the exact model/SKU/configuration. If exact chronology is not established, use NOVELTY_UNVERIFIED or the repository's equivalent uncertain state."
lesson: "Family or chassis age is not target-SKU age. A sibling model is neutral context until exact-model chronology is verified; ambiguous evidence must not increase confidence in a negative verdict."
clankops_consequence: "OEM Radar HIT remains a valid discovery outcome unless Radar evidence is disproven. Editorial triage must separate family age from target SKU age and preserve uncertainty rather than suppressing a candidate."
relationships:
