expected:
  classification: [EDITORIAL_TRIAGE_FAILURE, NOVELTY_FAILURE, FALSE_NEGATIVE]
  status: RESOLVED
  root_cause: "Exact-SKU chronology was not established before a negative editorial verdict; sibling/family age was incorrectly treated as target-SKU age."
  root_cause_must_not_be_invented: true
  preserves_original_claim: true
  preserves_superseding_claim: true
  preserves_contradiction: true
  resolution_linked: true
